<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB4 + D455 · 重建分析</title>
<style>@font-face{font-family:ReconChinese;src:url('noto-sc-subset.ttf?v=3') format('truetype');font-weight:400 600;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#dfebf8;font:14px ReconChinese,system-ui}header{padding:20px 24px;border-bottom:1px solid #253449;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}small,.muted{color:#8fa9c2}main{display:grid;grid-template-columns:minmax(560px,2fr) minmax(330px,1fr);gap:16px;padding:16px}.card{background:#121f30;border:1px solid #26364b;border-radius:12px;overflow:hidden}.toolbar{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font-family:ReconChinese,system-ui;background:#21364d;color:#e8f4ff;border:1px solid #39516b;padding:8px;border-radius:6px;cursor:pointer}input{accent-color:#55d7c0}#view{width:100%;height:60vh;display:block;touch-action:none}#status{padding:10px 16px;min-height:42px;color:#55d7c0}.timeline{padding:16px;border-top:1px solid #26364b}#frame{width:100%}.stats{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.stat b{display:block;font-size:24px;color:#61dbc6}.stat span{font-size:12px;color:#9cb4cb}.images{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.images img{width:100%;background:#07101b;min-height:60px}.images figure{margin:0}.images figcaption{font-size:12px;color:#adc2d5;margin:4px 0 8px}.note{padding:16px;color:#a7bfd3;line-height:1.7}a{color:#66e2cd}#chart{width:100%;height:145px}#warning{color:#ffc46a}footer{padding:12px 24px;color:#8fa9c2}@media(max-width:900px){main{grid-template-columns:1fr}#view{height:50vh}}
</style><header><div><h1>4 RGB + D455 · 三维重建分析</h1><small>capture_20261014_202456 · DA3-GIANT · 标定坐标系 / 米</small></div><span id="progress">正在读取结果…</span></header>
<main><div><section class="card"><div class="toolbar"><select id="layer"><option value="fused">RGB4 + D455 融合</option><option value="rgb4">仅 RGB4 重建</option><option value="d455">仅 D455 实测</option><option value="camera_0">RGB 相机 0</option><option value="camera_1">RGB 相机 1</option><option value="camera_2">RGB 相机 2</option><option value="camera_3">RGB 相机 3</option></select><label>点大小 <input id="size" type="range" min="1" max="8" value="2"></label><button id="reset">重置视角</button><a id="download" download>下载当前 PLY</a><input id="file" type="file" accept=".ply" hidden></div><div id="status">等待重建结果</div><canvas id="view"></canvas><div class="timeline"><div style="display:flex;justify-content:space-between"><button id="play">逐帧预览</button><span id="time"></span></div><input id="frame" type="range" min="0" max="0" value="0"><small>拖动旋转 · Shift / 右键平移 · 滚轮缩放</small></div></section><section class="card" style="margin-top:16px"><div class="toolbar"><select id="metric"><option value="median_abs_mm">深度绝对差中位数 / mm</option><option value="p90_abs_mm">深度绝对差 P90 / mm</option><option value="signed_median_mm">带符号深度差 / mm</option><option value="force_load">对齐力计读数 / N</option></select><small>点击曲线跳转帧</small></div><canvas id="chart"></canvas><div class="note" id="summary"></div></section></div>
<aside><section class="card"><div class="stats"><div class="stat"><b id="points">—</b><span>当前点数</span></div><div class="stat"><b id="error">—</b><span>重叠像素深度差中位数 / mm</span></div><div class="stat"><b id="memory">—</b><span>CUDA 峰值 reserved / GiB</span></div><div class="stat"><b id="sync">—</b><span>D455 时间偏差 / ms</span></div></div><div class="note" id="warning"></div></section><section class="card" style="margin-top:16px"><div class="toolbar"><select id="imageMode"><option value="rgb">四路 RGB</option><option value="depth">四路预测深度</option></select></div><div class="images" id="images"></div><div class="images"><figure><img id="d455image"><figcaption>D455 RGB</figcaption></figure><figure><img id="difference"><figcaption>深度绝对差：0–20mm，黑色无比较</figcaption></figure></div></section><section class="card note" style="margin-top:16px">标定反投影 + D455 深度校正 + 1mm 体素融合。点云只含裁剪后的实验区域，不是封闭网格。D455 不作为 DA3 输入；深度差不是绝对精度。<br><a href="report.json" target="_blank">下载分析报告 JSON</a></section></aside></main><footer>每帧独立四视角推理，不跨时间融合。</footer><script>
'use strict';
function parsePLY(buffer){
 const bytes=new Uint8Array(buffer),decoder=new TextDecoder();
 let end=-1;
 for(let i=0;i<Math.min(bytes.length,1048576)-10;i++)if((i===0||bytes[i-1]===10)&&decoder.decode(bytes.subarray(i,i+10))==='end_header'){
  let j=i+10;if(bytes[j]===13)j++;if(bytes[j]!==10)continue;end=j+1;break;
 }
 if(end<0)throw Error('找不到 PLY 文件头');
 const lines=decoder.decode(bytes.subarray(0,end)).trim().split(/\r?\n/);
 if(lines[0]!=='ply')throw Error('不是 PLY 文件');
 let format='',count=0,active=false,seen=false,props=[];
 const types={char:['getInt8',1],int8:['getInt8',1],uchar:['getUint8',1],uint8:['getUint8',1],short:['getInt16',2],int16:['getInt16',2],ushort:['getUint16',2],uint16:['getUint16',2],int:['getInt32',4],int32:['getInt32',4],uint:['getUint32',4],uint32:['getUint32',4],float:['getFloat32',4],float32:['getFloat32',4],double:['getFloat64',8],float64:['getFloat64',8]};
 for(const line of lines){const p=line.trim().split(/\s+/);
  if(p[0]==='format')format=p[1];
  if(p[0]==='element'){active=p[1]==='vertex';if(!seen&&!active&&Number(p[2])>0)throw Error('vertex 必须是第一个非空元素');if(active){count=Number(p[2]);seen=true;}}
  if(p[0]==='property'&&active){if(!types[p[1]])throw Error('不支持的顶点属性类型');props.push({name:p[2],type:types[p[1]]});}
 }
 if(!['ascii','binary_little_endian'].includes(format))throw Error('不支持该 PLY 编码');
 if(!Number.isSafeInteger(count)||count<=0||count>10000000)throw Error('顶点数必须为 1 至 1000 万');
 const indices=['x','y','z'].map(n=>props.findIndex(p=>p.name===n));if(indices.includes(-1))throw Error('缺少 XYZ 坐标');
 const colors=['red','green','blue'].map(n=>props.findIndex(p=>p.name===n));
 const data=new Float32Array(count*6),lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
 const rows=format==='ascii'?decoder.decode(bytes.subarray(end)).trim().split(/\r?\n/):null,view=new DataView(buffer);let offset=end,n=0;
 for(let i=0;i<count;i++){
  const values=rows?(rows[i]||'').trim().split(/\s+/).map(Number):props.map(p=>{const v=view[p.type[0]](offset,true);offset+=p.type[1];return v;});
  if(values.length<props.length)throw Error('PLY 数据不完整');
  const xyz=indices.map(k=>values[k]);if(!xyz.every(Number.isFinite))continue;
  for(let k=0;k<3;k++){data[n*6+k]=xyz[k];lo[k]=Math.min(lo[k],xyz[k]);hi[k]=Math.max(hi[k],xyz[k]);data[n*6+3+k]=colors[k]<0?0.75:Math.max(0,Math.min(1,values[colors[k]]/255));}n++;
 }
 if(!n)throw Error('没有有效顶点');
 const span=0.31; const center=[0.085,-0.075,0.06];
 for(let i=0;i<n;i++)for(let k=0;k<3;k++)data[i*6+k]=(data[i*6+k]-center[k])/span*2;
 return {data:data.subarray(0,n*6),count:n,span};
}
const canvas=document.querySelector('#view'),status=document.querySelector('#status'),gl=canvas.getContext('webgl');
let yaw=0,pitch=0,zoom=1,panX=0,panY=0,count=0;
function reset(){yaw=-0.5;pitch=0.6;zoom=1.6;panX=panY=0;draw();}
let program;
if(!gl){status.textContent='浏览器不支持 WebGL，请启用硬件加速。';}else{
 function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
 program=gl.createProgram();
 gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 position;attribute vec3 color;varying vec3 rgb;uniform vec4 camera;uniform vec3 viewport;uniform vec2 pan;void main(){float a=camera.x,b=camera.y;vec3 p=vec3(cos(a)*position.x-sin(a)*position.y,sin(a)*position.x+cos(a)*position.y,position.z);p=vec3(p.x,cos(b)*p.y-sin(b)*p.z,sin(b)*p.y+cos(b)*p.z);float d=4.0+p.y;gl_Position=vec4(p.x*camera.z/viewport.x+pan.x*d,p.z*camera.z+pan.y*d,0.2*p.y,d);gl_PointSize=camera.w;rgb=color;}`));
 gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 rgb;void main(){if(length(gl_PointCoord-vec2(0.5))>0.5)discard;gl_FragColor=vec4(rgb,1.0);}`));
 gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
 for(const [name,offset] of [['position',0],['color',12]]){let loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,24,offset);}
 gl.enable(gl.DEPTH_TEST);gl.clearColor(0.035,0.055,0.085,1);
}
function draw(){if(!gl)return;const dpr=Math.min(devicePixelRatio,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform4f(gl.getUniformLocation(program,'camera'),yaw,pitch,zoom*2,Number(document.querySelector('#size').value)*dpr);gl.uniform3f(gl.getUniformLocation(program,'viewport'),canvas.width/canvas.height,0,0);gl.uniform2f(gl.getUniformLocation(program,'pan'),panX,panY);gl.drawArrays(gl.POINTS,0,count);}
document.querySelector('#file').onchange=async e=>{const file=e.target.files[0];if(!file||!gl)return;status.textContent='正在载入…';try{if(file.size>512*1024*1024)throw Error('请选择小于 512 MB 的文件');const cloud=parsePLY(await file.arrayBuffer());gl.bufferData(gl.ARRAY_BUFFER,cloud.data,gl.STATIC_DRAW);count=cloud.count;reset();status.textContent=`${file.name} · ${count.toLocaleString()} 点 · 最大轴跨度 ${cloud.span.toPrecision(5)}（原文件单位）`;}catch(error){count=0;draw();status.textContent='载入失败：'+error.message;}};
let drag=null;canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2};};canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){panX+=2*dx/canvas.clientWidth;panY-=2*dy/canvas.clientHeight;}else{yaw+=dx*0.008;pitch=Math.max(-1.55,Math.min(1.55,pitch+dy*0.008));}drag.x=e.clientX;drag.y=e.clientY;draw();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.05,Math.min(30,zoom*Math.exp(-e.deltaY*0.001)));draw();},{passive:false});document.querySelector('#reset').onclick=reset;document.querySelector('#size').oninput=draw;window.onresize=draw;reset();


let report={frames:[]},current=0,token=0,playing=false,loading=false;
const el=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch('report.json',{cache:'no-store'});if(!r.ok)throw Error('尚无报告');const selected=report.frames[current]?.frame;report=await r.json();if(selected!==undefined){const i=report.frames.findIndex(f=>f.frame===selected);if(i>=0)current=i;}el('frame').value=current;el('progress').textContent=`${report.frames.length} / ${report.target_frames} 个时间点已完成`;el('frame').max=Math.max(0,report.frames.length-1);el('summary').textContent=report.summary||'';chart();if(report.frames.length&&count===0)await selectFrame(0);}catch(e){el('progress').textContent='等待重建输出…';}}
async function selectFrame(index){if(!report.frames.length)return;current=Math.max(0,Math.min(index,report.frames.length-1));el('frame').value=current;const f=report.frames[current],base='frames/'+String(f.frame).padStart(5,'0')+'/',layer=el('layer').value,id=++token;loading=true;status.textContent='正在载入点云…';el('time').textContent=`帧 ${f.frame} / 870 · ${f.time_s.toFixed(2)} s`;
 el('error').textContent=f.median_abs_mm?.toFixed(2)||'—';el('memory').textContent=f.peak_reserved_gib.toFixed(2);el('sync').textContent=f.d455_dt_ms.toFixed(1);el('warning').textContent=Math.abs(f.d455_dt_ms)>40?'此帧同步偏差超过 40ms，融合及差异仅供参考。':'';el('download').href=base+layer+'.ply';el('d455image').src=base+'d455_rgb.jpg';el('difference').src=base+'difference.jpg';imagePanels();
 try{const r=await fetch(base+layer+'.ply');if(!r.ok)throw Error('文件尚未生成');const cloud=parsePLY(await r.arrayBuffer());if(id!==token)return;gl.bufferData(gl.ARRAY_BUFFER,cloud.data,gl.STATIC_DRAW);count=cloud.count;draw();el('points').textContent=count.toLocaleString();status.textContent=`${el('layer').selectedOptions[0].text} · ${count.toLocaleString()} 点 · 世界坐标单位：米`;}catch(e){if(id===token){count=0;draw();status.textContent=e.message;}}finally{if(id===token)loading=false;}chart();}
function imagePanels(){if(!report.frames.length)return;const f=report.frames[current],base='frames/'+String(f.frame).padStart(5,'0')+'/';el('images').innerHTML=[0,1,2,3].map(v=>`<figure><img src="${base}${el('imageMode').value}_${v}.jpg"><figcaption>相机 ${v}</figcaption></figure>`).join('');}
function chart(){const c=el('chart'),ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=145*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);const w=c.clientWidth,h=145,fs=report.frames,key=el('metric').value;if(!fs.length)return;const values=fs.map(f=>f[key]).filter(v=>Number.isFinite(v));const low=Math.min(0,...values),high=Math.max(1,...values),span=high-low,max=high+span*.1,min=low-span*.05;ctx.fillStyle='#8fa9c2';ctx.font='12px ReconChinese,system-ui';ctx.fillText(max.toFixed(1),8,15);ctx.fillText(min.toFixed(1),8,h-12);ctx.strokeStyle='#55d7c0';ctx.lineWidth=2;ctx.beginPath();let connected=false;fs.forEach(f=>{if(!Number.isFinite(f[key])){connected=false;return;}const x=45+f.time_s/(870/6)*(w-60),y=h-20-(f[key]-min)/(max-min)*(h-40);connected?ctx.lineTo(x,y):ctx.moveTo(x,y);connected=true;});ctx.stroke();ctx.strokeStyle='#e9c465';const x=45+(fs[current]?.time_s||0)/(870/6)*(w-60);ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,h-20);ctx.stroke();}
el('metric').onchange=chart;
el('chart').onclick=e=>{const t=Math.max(0,(e.offsetX-45)/(el('chart').clientWidth-60))*870/6;let best=0;report.frames.forEach((f,i)=>{if(Math.abs(f.time_s-t)<Math.abs(report.frames[best].time_s-t))best=i;});selectFrame(best);};el('frame').oninput=e=>selectFrame(Number(e.target.value));el('layer').onchange=()=>selectFrame(current);el('imageMode').onchange=imagePanels;el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'暂停':'逐帧预览';};setInterval(()=>{if(playing&&!loading&&report.frames.length)selectFrame((current+1)%report.frames.length);},900);setInterval(refresh,15000);refresh();
</script></html>
